[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sheetflow"
version = "0.1.0"
description = "面向工作表驱动工作流的办公自动化工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docxtpl>=0.16",
    "more-itertools>=10.0",
    "xlwings>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sheetflow"]

# 优先使用清华源；清华源未找到或无法提供某个包时回退到官方 PyPI。
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
